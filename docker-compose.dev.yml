version: "2.4"

services:

  # 开发模式：前端使用 npm run dev（支持 HMR），可实时编辑代码
  # 使用方法：
  #   make build-dev
  #   docker-compose -f docker-compose.dev.yml up
  talebook-dev:
    container_name: bookharbor-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: ghcr.io/leonzy/bookharbor:dev
    restart: always
    volumes:
      - /tmp/talebook-dev:/data
      # 挂载本地 app/ 目录，修改代码后 nuxt dev 自动热更新
      - ./app:/var/www/talebook/app
      # Go 后端源码修改后重新构建镜像；前端继续在宿主启动 Nuxt。
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
