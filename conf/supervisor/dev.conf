[group:talebook]
programs=nginx,bootstrap,booksvr

[program:nginx]
command = /usr/sbin/nginx -g 'daemon off;'
user=talebook
autostart=true
autorestart=unexpected

; 启动自检：权限校验、nginx 配置检查、syncdb/migrate/update-config，逐项写入
; status.json；全部通过后才会 `supervisorctl start talebook:booksvr`。失败时不重试
; （autorestart=false），nginx 与 /status.json、/status_page.html 仍然可访问。
[program:bootstrap]
command=python3 /opt/talebook-upgrade/self_check.py
environment=TALEBOOK_SERVER_DIR="/var/www/talebook"
directory=/var/www/talebook
autostart=true
autorestart=false
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
; Tornado 已下线：全部 215 条 legacy 路由由 booksvr 本地实现，不再需要 Python 后端。
; 历史 Python HTTP 后端已删除，回滚通过完整容器镜像完成。

; booksvr 是唯一对外 HTTP 后端，监听 8000，本地服务全部路由。
; autostart=false：由 bootstrap 自检全部通过后再拉起，以保证它晚于 syncdb/migrate
; 打开数据库。密钥经 BOOKSVR_COOKIE_SECRET 环境变量传入（由 self_check.py 从
; settings 读出），不写在命令行，避免 ps 泄露。
[program:booksvr]
user=talebook
command=/usr/bin/python3 /opt/talebook-upgrade/booksvr-entrypoint.py /usr/local/bin/booksvr serve -db=/data/books/library/metadata.db -user-db=/data/books/calibre-webserver.db -addr=127.0.0.1:8000 -serve-routes=all -library-root=/data/books/library -settings-file=/data/books/settings/auto.py
environment=TALEBOOK_SERVER_DIR="/var/www/talebook"
directory=/var/www/talebook
stopasgroup=true
killasgroup=true
stopwaitsecs=30
autostart=false
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
