name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images (manual runs are verification-only by default)
        type: boolean
        default: false
  push:
    branches:
      - main
      - dev/*
      - claude/*
      - codex/*
    tags:
      - "v*"
  pull_request:
    branches:
      - main

env:
  GHCR_REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # ----------------------------------------
  # 只在 Docker 镜像输入发生变化时继续重型构建。
  # 文档、方案、测试夹具等纯仓库维护改动不需要重新构建并推送镜像。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.decide.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter Docker build inputs
        id: filter
        if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            docker:
              - 'app/**'
              - 'booksvr/**'
              - 'resources/**'
              - 'conf/**'
              - 'docker/**'
              - 'scripts/upgrade/**'
              - 'scripts/install_tomato_downloader.py'
              - 'document/licenses/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - 'requirements.txt'
              - 'requirements-test.txt'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/build.yml'

      - name: Decide Docker build
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DOCKER_CHANGED: ${{ steps.filter.outputs.docker }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_TYPE" == "tag" || "$DOCKER_CHANGED" == "true" ]]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------
  # 计算构建矩阵与公共构建参数。
  # PR、main 和手动验证构建 amd64；正式版本和其他分支保持三架构构建。
  prepare:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      build_args: ${{ steps.prep.outputs.build_args }}
      safe_ref_name: ${{ steps.prep.outputs.safe_ref_name }}
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare build args and safe ref name
        id: prep
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="$(git show -s --format=%cd --date=format:v%y.%m.%d HEAD)-dev-${GITHUB_SHA:0:7}"
          fi
          SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}
          {
            echo 'build_args<<UPGRADE_ARGS'
            echo "GIT_VERSION=$VERSION"
            echo "GIT_COMMIT=$GITHUB_SHA"
            echo "UPGRADE_SEQUENCE=$(git show -s --format=%ct HEAD)"
            echo 'UPGRADE_ARGS'
          } >> "$GITHUB_OUTPUT"
          echo "safe_ref_name=$SAFE_REF_NAME" >> $GITHUB_OUTPUT
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set build matrix
        id: matrix
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "workflow_dispatch" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo 'matrix={"platform":["linux/amd64"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"platform":["linux/amd64","linux/arm64","linux/arm/v7"]}' >> $GITHUB_OUTPUT
          fi

  # ----------------------------------------
  # 每个平台单独一个 job 构建，按 digest 推送（不打 tag）。
  # 单平台构建保证同一 BuildKit 内不会并发跑多个 calibredb（见 issue #816）。
  build:
    needs: prepare
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Platform safe name
        id: pname
        run: echo "name=${platform//\//-}" >> $GITHUB_OUTPUT
        env:
          platform: ${{ matrix.platform }}

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build outputs
        id: out
        env:
          PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: |
          if [[ "$PUBLISH" == "true" ]]; then
            echo "value=type=image,name=${GHCR_REGISTRY}/${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=type=docker" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SPA
        id: spa
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production-spa
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: ${{ steps.out.outputs.value }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=gha,scope=spa-${{ steps.pname.outputs.name }}
          cache-to: type=gha,scope=spa-${{ steps.pname.outputs.name }},mode=max

      - name: Build SSR
        id: ssr
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production-ssr
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: ${{ steps.out.outputs.value }}
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=gha,scope=ssr-${{ steps.pname.outputs.name }}
          cache-to: type=gha,scope=ssr-${{ steps.pname.outputs.name }},mode=max

      - name: Build development image
        if: matrix.platform == 'linux/amd64' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dev
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:dev
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dev-linux-amd64
          cache-to: type=gha,scope=dev-linux-amd64,mode=max

      - name: Export digests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          mkdir -p /tmp/digests/spa /tmp/digests/ssr
          echo "${{ steps.spa.outputs.digest }}" > "/tmp/digests/spa/${{ steps.pname.outputs.name }}"
          echo "${{ steps.ssr.outputs.digest }}" > "/tmp/digests/ssr/${{ steps.pname.outputs.name }}"

      - name: Upload digests
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.pname.outputs.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ----------------------------------------
  # 把各平台 digest 合并成 multi-arch manifest，并打上最终 tag。
  # PR 不推送，跳过本 job。
  merge:
    needs: [prepare, build]
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BookHarbor SPA 镜像：GHCR 的 main / latest / 版本或开发分支标签。
      - name: Create SPA manifest
        run: |
          for TARGET_REGISTRY in "$GHCR_REGISTRY"; do
            IMAGE="${TARGET_REGISTRY}/${IMAGE_NAME}"
            TAGS=()
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              TAGS+=("-t" "${IMAGE}:latest" "-t" "${IMAGE}:${GITHUB_REF_NAME}")
            fi
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              TAGS+=("-t" "${IMAGE}:main")
            fi
            if [[ "$GITHUB_REF" == refs/heads/dev/* || "$GITHUB_REF" == refs/heads/claude/* || "$GITHUB_REF" == refs/heads/codex/* ]]; then
              TAGS+=("-t" "${IMAGE}:${SAFE_REF_NAME}")
            fi
            if [[ ${#TAGS[@]} -eq 0 ]]; then continue; fi
            SRCS=()
            for f in /tmp/digests/spa/*; do SRCS+=("${IMAGE}@$(cat "$f")"); done
            docker buildx imagetools create "${TAGS[@]}" "${SRCS[@]}"
          done
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SAFE_REF_NAME: ${{ needs.prepare.outputs.safe_ref_name }}

      # GHCR 的 SSR 镜像：server-side-render / server-side-render-<ver|branch>
      - name: Create SSR manifest
        run: |
          for TARGET_REGISTRY in "$GHCR_REGISTRY"; do
            IMAGE="${TARGET_REGISTRY}/${IMAGE_NAME}"
            TAGS=()
            if [[ $GITHUB_REF == refs/tags/* ]]; then
              TAGS+=("-t" "${IMAGE}:server-side-render" "-t" "${IMAGE}:server-side-render-${GITHUB_REF_NAME}")
            fi
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              TAGS+=("-t" "${IMAGE}:server-side-render")
            fi
            if [[ "$GITHUB_REF" == refs/heads/dev/* || "$GITHUB_REF" == refs/heads/claude/* || "$GITHUB_REF" == refs/heads/codex/* ]]; then
              TAGS+=("-t" "${IMAGE}:server-side-render-${SAFE_REF_NAME}")
            fi
            if [[ ${#TAGS[@]} -eq 0 ]]; then continue; fi
            SRCS=()
            for f in /tmp/digests/ssr/*; do SRCS+=("${IMAGE}@$(cat "$f")"); done
            docker buildx imagetools create "${TAGS[@]}" "${SRCS[@]}"
          done
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SAFE_REF_NAME: ${{ needs.prepare.outputs.safe_ref_name }}
