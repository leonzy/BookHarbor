name: Code Quality Check and Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - dev-*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Validate internal design documents
        run: make check-design
      - name: Validate domain specification documents
        run: make check-spec
      - name: Validate locale JSON and compiler-sensitive values
        run: make check-i18n

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: booksvr/go.sum
      - name: Go backend tests and vet
        run: |
          cd booksvr
          if [ "$(id -u)" = 0 ]; then
            # act runs as root; execute permission-sensitive binaries as nobody.
            go test ./... -skip 'TestFileThemeStoreWriteFileError|TestBackupCreateFailsOnReadOnlyDir'
            permission_dir=$(mktemp -d)
            chmod 755 "$permission_dir"
            go test -c -o "$permission_dir/httpapi.test" ./internal/httpapi
            go test -c -o "$permission_dir/reindex.test" ./internal/reindex
            runuser -u nobody -- "$permission_dir/httpapi.test" -test.run '^TestFileThemeStoreWriteFileError$'
            runuser -u nobody -- "$permission_dir/reindex.test" -test.run '^TestBackupCreateFailsOnReadOnlyDir$'
          else
            go test ./...
          fi
          go vet ./...
      - name: Install image management test dependencies
        run: |
          python3 -m venv /tmp/bookharbor-management-tests
          /tmp/bookharbor-management-tests/bin/pip install pytest cryptography 'ruff>=0.1.0'
      - name: Image management tests
        run: |
          # The image-owned upgrade executor requires root-owned trust configuration.
          if [ "$(id -u)" = 0 ]; then
            /tmp/bookharbor-management-tests/bin/python -m pytest tests -q
          else
            sudo -n /tmp/bookharbor-management-tests/bin/python -m pytest tests -q
          fi
      - name: Python lint and formatting
        run: |
          if [ "$(id -u)" = 0 ]; then
            PATH="/tmp/bookharbor-management-tests/bin:$PATH" make lint-py
          else
            sudo -n env PATH="/tmp/bookharbor-management-tests/bin:$PATH" make lint-py
          fi

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Run linting
        run: npm run lint
      - name: Run all unit and component tests
        run: npx vitest run --maxWorkers=1 test/components test/composables test/plugins test/stores test/utils
      - name: Nuxt SSR build
        run: npm run build
      - name: Nuxt SPA build
        run: npm run generate
      - name: Generate build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nuxt-build
          path: |
            app/.nuxt
            app/.output
          retention-days: 1

  test-library-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      API_URL: http://127.0.0.1:8080
      MOCK_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run library browser regressions (including picker and keyboard cases)
        run: npx playwright test -c playwright.library.config.ts
      - name: Upload browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-browser-results
          path: app/test-results
          retention-days: 7

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache-dependency-path: booksvr/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Check reachable Go vulnerabilities
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: booksvr

  integration-test:
    if: always()
    needs: [check-design, test-server, test-ui, test-library-browser, dependency-review, govulncheck]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required checks
        env:
          CHECK_DESIGN: ${{ needs.check-design.result }}
          TEST_SERVER: ${{ needs.test-server.result }}
          TEST_UI: ${{ needs.test-ui.result }}
          TEST_BROWSER: ${{ needs.test-library-browser.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          GOVULNCHECK: ${{ needs.govulncheck.result }}
        run: |
          set -eu
          for result in "$CHECK_DESIGN" "$TEST_SERVER" "$TEST_UI" "$TEST_BROWSER" "$GOVULNCHECK"; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
          if [ "$DEPENDENCY_REVIEW" != "success" ] && [ "$DEPENDENCY_REVIEW" != "skipped" ]; then
            echo "Dependency review failed: $DEPENDENCY_REVIEW" >&2
            exit 1
          fi
          echo "All required CI checks passed; dependency review: $DEPENDENCY_REVIEW"
