name: Code Quality Check and Build

on:
  push:
    branches:
      - master
      - dev
      - dev-*
  pull_request:
    branches:
      - master

jobs:
  check-design:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate internal design documents
        run: make check-design

      - name: Validate domain specification documents
        run: make check-spec

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: booksvr/go.mod
          cache-dependency-path: booksvr/go.sum
      - name: Go backend tests and vet
        run: |
          cd booksvr
          go test ./...
          go vet ./...
      - name: Image management tests
        run: |
          python3 -m pip install pytest cryptography
          python3 -m pytest tests -q

  test-ui:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Run linting
        run: |
          cd app
          npm run lint

      - name: Nuxt build
        run: |
          cd app
          npm run build

      - name: Generate build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: app/.nuxt
          retention-days: 1

  test-library-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      API_URL: http://127.0.0.1:8080
      MOCK_API_URL: http://127.0.0.1:8080

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Test metadata contract and pagination components
        run: npx vitest run --maxWorkers=1 test/utils/metadata-pagination.spec.ts test/components/MetaList.spec.ts test/components/useMetadataPage.spec.ts test/components/LocalLibraryContent.spec.ts test/components/LibraryChipFilter.spec.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run library browser regressions (including picker and keyboard cases)
        run: npx playwright test -c playwright.library.config.ts
      - name: Upload browser results and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-browser-results
          path: app/test-results
          retention-days: 7

  integration-test:
    runs-on: ubuntu-latest
    needs: [check-design, test-server, test-ui, test-library-browser]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: All tests passed
        run: |
          echo "✅ All tests completed successfully"
          echo "Server tests: ✓"
          echo "UI tests: ✓"
