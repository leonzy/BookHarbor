# 跟踪应用、运行时和 CI 依赖；阅读器仍由 npm 精确版本与同步测试约束。
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: gomod
    directory: /booksvr
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels:
      - dependencies
